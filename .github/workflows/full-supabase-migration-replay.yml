name: Full Supabase Migration Replay

on:
  push:
    branches:
      - "test/**"
    paths:
      - "supabase/**"
      - ".github/workflows/full-supabase-migration-replay.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/full-supabase-migration-replay.yml"

permissions:
  contents: read

concurrency:
  group: full-supabase-migration-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay every SQL migration on isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Verify isolated Docker runtime
        run: docker info

      - name: Stage the schema foundation before seed data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          sequence=1
          for file in supabase/001_initial_schema.sql supabase/002_rls_policies.sql; do
            base="$(basename "$file")"
            printf -v version '2026111300%04d' "$sequence"
            cp "$file" "supabase/migrations/${version}_${base}"
            sequence=$((sequence + 1))
          done

      - name: Start isolated local Supabase and seed the foundation
        run: |
          supabase start
          supabase db reset

      - name: Stage and apply all repeatable migrations after seed data
        shell: bash
        run: |
          set -euo pipefail
          sequence=3
          for file in supabase/[0-9][0-9][0-9]_*.sql; do
            base="$(basename "$file")"
            # 001/002 were applied before seed data. 003 is a one-time manual
            # Auth-user bootstrap, not a repeatable migration.
            if [[ "$base" == "001_initial_schema.sql" || "$base" == "002_rls_policies.sql" || "$base" == "003_bootstrap_first_admin.sql" ]]; then
              continue
            fi
            printf -v version '2026111300%04d' "$sequence"
            cp "$file" "supabase/migrations/${version}_${base}"
            sequence=$((sequence + 1))
          done
          echo "Staged $((sequence - 3)) repeatable migrations after the seeded foundation."
          supabase migration up

      - name: Run database pgTAP tests when present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            supabase test db
          else
            echo "No supabase/tests/*.sql pgTAP suite is stored in this repository; migration replay is the database validation performed here."
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
