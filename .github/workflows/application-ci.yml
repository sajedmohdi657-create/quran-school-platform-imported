name: Application CI

on:
  push:
    branches:
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-validation:
    name: Tests, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack and activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application tests, runtime tests, typecheck, and production build
        run: pnpm build

      - name: Check patch whitespace
        run: git diff --check
