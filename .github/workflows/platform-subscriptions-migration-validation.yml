name: Platform Subscriptions Migration Validation

on:
  push:
    branches:
      - "test/**"
    paths:
      - "supabase/**"
      - ".github/workflows/platform-subscriptions-migration-validation.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/platform-subscriptions-migration-validation.yml"

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Verify GitHub-hosted runner allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner started
        run: |
          echo "GitHub-hosted runner started successfully."
          uname -a
          docker --version

  validate-platform-subscriptions:
    name: Apply migration 082 on isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI v3
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Verify Docker runtime
        run: docker info

      - name: Stage schema foundation before seed data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          cp supabase/001_initial_schema.sql supabase/migrations/20261106000001_001_initial_schema.sql
          cp supabase/002_rls_policies.sql supabase/migrations/20261106000002_002_rls_policies.sql
          cp supabase/082_platform_subscriptions_foundation.sql /tmp/082_platform_subscriptions_foundation.sql

      - name: Start isolated local Supabase and seed the foundation
        run: |
          supabase start
          supabase db reset

      - name: Stage and apply repeatable baseline migrations 004–081 after seed
        shell: bash
        run: |
          set -euo pipefail
          sequence=4
          for file in supabase/[0-9][0-9][0-9]_*.sql; do
            base="$(basename "$file")"
            if [[ "$base" == "001_initial_schema.sql" || "$base" == "002_rls_policies.sql" || "$base" == "003_bootstrap_first_admin.sql" || "$base" == 08[2-9]_* ]]; then
              continue
            fi
            printf -v version '20261106%06d' "$sequence"
            cp "$file" "supabase/migrations/${version}_${base}"
            sequence=$((sequence + 1))
          done
          echo "Applying repeatable migrations 004–081; one-time Auth bootstrap and subscription migrations are held back."
          supabase migration up

      - name: Apply migration 082 after baseline migrations
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/082_platform_subscriptions_foundation.sql supabase/migrations/20261106000082_082_platform_subscriptions_foundation.sql
          supabase migration up

      - name: Apply later repeatable migrations 083–084
        shell: bash
        run: |
          set -euo pipefail
          cp supabase/083_subscription_plan_range_bounds.sql supabase/migrations/20261106000083_083_subscription_plan_range_bounds.sql
          cp supabase/084_attendance_transactional_sync.sql supabase/migrations/20261106000084_084_attendance_transactional_sync.sql
          supabase migration up

      - name: Run pgTAP migration and security assertions when present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            supabase test db
          else
            echo "No supabase/tests/*.sql pgTAP suite is present; this workflow validates migration replay only."
          fi

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
